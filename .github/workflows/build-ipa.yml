name: NroChamPa

on:
workflow_dispatch:
push:
branches:
- main
- master

permissions:
contents: read

jobs:
build:
name: Build NroChamPa IPA
runs-on: macos-14
timeout-minutes: 120

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      lfs: true
      fetch-depth: 1

  - name: Select Xcode
    shell: bash
    run: |
      set -euo pipefail
      if [ -d "/Applications/Xcode_15.4.app/Contents/Developer" ]; then
        sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      fi
      xcode-select -p
      xcodebuild -version
      xcrun --sdk iphoneos --show-sdk-version

  - name: Check Unity libraries
    shell: bash
    run: |
      set -euo pipefail
      for f in Libraries/libiPhone-lib.a Libraries/baselib.a; do
        if [ -f "$f" ]; then
          echo "Checking $f"
          file "$f"
          if head -c 100 "$f" | grep -q 'git-lfs.github.com/spec'; then
            echo "::error::Git LFS pointer detected: $f"
            exit 1
          fi
        else
          echo "::warning::Library not found: $f"
        fi
      done

  - name: Check project and build script
    shell: bash
    run: |
      set -euo pipefail
      test -f scripts/build-ipa.sh
      find . -maxdepth 3 \( -name '*.xcodeproj' -o -name '*.xcworkspace' \) -print
      test -d Unity-iPhone.xcodeproj

  - name: Build unsigned IPA
    shell: bash
    env:
      PROJECT: Unity-iPhone.xcodeproj
      SCHEME: Unity-iPhone
      CONFIG: Release
      APP_NAME: NroChamPa
      IPA_NAME: NroChamPa.ipa
      OUT_DIR: build
    run: bash scripts/build-ipa.sh

  - name: Verify IPA
    shell: bash
    run: |
      set -euo pipefail
      test -s build/NroChamPa.ipa
      unzip -t build/NroChamPa.ipa
      unzip -Z1 build/NroChamPa.ipa | grep -E '^Payload/[^/]+\.app/Info\.plist$'
      ls -lh build/NroChamPa.ipa

  - name: Upload IPA
    uses: actions/upload-artifact@v4
    with:
      name: NroChamPa
      path: build/NroChamPa.ipa
      if-no-files-found: error
      retention-days: 30
